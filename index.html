<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The ArchIve Portal</title>
  <style>
    @font-face {
      font-family: 'Cascadia Code';
      src: local('Cascadia Code'), local('Cascadia Mono');
    }
    :root {
      --bg: #000000;
      --fg: #00FF00;
      --scanline: rgba(0, 0, 0, 0.18);
      --error: #ff4444;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }
    body {
      font-family: 'Cascadia Code', 'Cascadia Mono', Consolas, 'SF Mono', Menlo, 'Courier New', monospace;
      font-variant-ligatures: none;
      cursor: default;
    }
    .crt {
      position: fixed;
      inset: 0;
      background: var(--bg);
      overflow: hidden;
      border-radius: 18px;
      box-shadow:
        inset 0 0 8px 2px rgba(0, 0, 0, 0.9),
        inset 0 0 140px 40px rgba(0, 0, 0, 0.85);
      animation: powerOn 1.1s ease-out;
    }
    @keyframes powerOn {
      0% { filter: brightness(3) contrast(0.3); transform: scaleY(0.005); }
      4% { transform: scaleY(0.005); }
      12% { transform: scaleY(1); filter: brightness(3.5); }
      35% { filter: brightness(1); }
      100% { filter: brightness(1); transform: scaleY(1); }
    }
    .crt-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(ellipse at center,
          transparent 55%,
          rgba(0, 0, 0, 0.25) 78%,
          rgba(0, 0, 0, 0.75) 100%
        );
      mix-blend-mode: multiply;
    }
    .crt-curve {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        linear-gradient(to bottom,
          rgba(0,0,0,0.35) 0%,
          transparent 6%,
          transparent 94%,
          rgba(0,0,0,0.35) 100%
        );
    }
    .crt::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 1px,
        var(--scanline) 2px,
        var(--scanline) 3px
      );
      z-index: 3;
      opacity: 0.5;
    }
    .crt.no-scanlines::before {
      display: none;
    }
    .crt::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      animation: flicker 6s infinite;
    }
    .crt.no-flicker::after {
      animation: none;
      opacity: 1;
    }
    @keyframes flicker {
      0%, 96%, 100% { opacity: 1; }
      97% { opacity: 0.94; }
      98% { opacity: 1; }
      99% { opacity: 0.97; }
    }
    .crt-roll {
      position: fixed;
      left: 0;
      right: 0;
      height: 90px;
      pointer-events: none;
      z-index: 6;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 255, 0, 0.035) 50%,
        transparent 100%
      );
      animation: roll 9s linear infinite;
      mix-blend-mode: screen;
    }
    .crt-roll.hidden-effect {
      display: none;
    }
    @keyframes roll {
      0% { top: -90px; }
      100% { top: 100%; }
    }
    .crt-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
      animation: noiseShift 0.4s steps(4) infinite;
    }
    .crt-noise.hidden-effect {
      display: none;
    }
    @keyframes noiseShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(-1%, 2%); }
      100% { transform: translate(0, 0); }
    }
    .terminal-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      animation: jitter 8s infinite;
    }
    .terminal-wrap.no-jitter {
      animation: none;
    }
    @keyframes jitter {
      0%, 99.2%, 100% { transform: translate(0, 0); }
      99.3% { transform: translate(-2px, 1px); }
      99.45% { transform: translate(2px, -1px); }
      99.6% { transform: translate(-1px, 0); }
      99.75% { transform: translate(1px, 1px); }
    }
    .terminal {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 4vh 4vw;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .lines {
      font-size: clamp(13px, 1.6vw, 19px);
      line-height: 1.65;
      color: var(--fg);
      white-space: pre-wrap;
      max-width: 900px;
      text-shadow:
        0 0 3px var(--fg),
        0 0 10px rgba(0, 255, 0, 0.25),
        -1px 0 rgba(255, 0, 60, 0.35),
        1px 0 rgba(0, 120, 255, 0.35);
    }
    .line {
      opacity: 0;
      display: block;
    }
    .line.shown {
      opacity: 1;
    }
    .menu-row {
      white-space: pre;
      text-shadow:
        0 0 3px var(--fg),
        -1px 0 rgba(255, 0, 60, 0.3),
        1px 0 rgba(0, 120, 255, 0.3);
    }
    .menu-row.selected {
      color: #000000;
      background: var(--fg);
      text-shadow: none;
      box-shadow: 0 0 14px 2px rgba(0, 255, 0, 0.65);
    }
    .hint {
      position: absolute;
      bottom: 3vh;
      left: 4vw;
      font-size: clamp(10px, 1vw, 12px);
      color: var(--fg);
      opacity: 0;
      transition: opacity 1s ease;
      letter-spacing: 0.05em;
      text-shadow: 0 0 3px var(--fg);
    }
    .hint.shown { opacity: 0.6; }
    .play-screen {
      display: flex;
      flex-direction: column;
      gap: 1em;
      color: var(--fg);
      text-shadow:
        0 0 3px var(--fg),
        -1px 0 rgba(255, 0, 60, 0.3),
        1px 0 rgba(0, 120, 255, 0.3);
      font-size: clamp(13px, 1.6vw, 19px);
      height: 100%;
      overflow: hidden;
    }
    #play-screen-content {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    #play-screen-content::-webkit-scrollbar {
      width: 6px;
    }
    #play-screen-content::-webkit-scrollbar-track {
      background: transparent;
    }
    #play-screen-content::-webkit-scrollbar-thumb {
      background: var(--fg);
      opacity: 0.4;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 0.6ch;
    }
    #game-search {
      flex: 1;
      max-width: 500px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: inherit;
      caret-color: var(--fg);
      padding: 0.2em 0;
      text-shadow: 0 0 3px var(--fg);
    }
    #game-search::placeholder {
      color: var(--fg);
      opacity: 0.4;
    }
    .section-title {
      font-size: 0.9em;
      opacity: 0.7;
      margin-top: 0.5em;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 0.3em;
    }
    .game-row {
      white-space: pre;
    }
    .game-row.selected {
      color: #000000;
      background: var(--fg);
      text-shadow: none;
      box-shadow: 0 0 14px 2px rgba(0, 255, 0, 0.65);
    }
    .no-results {
      opacity: 0.5;
    }
    .pin-screen {
      display: flex;
      flex-direction: column;
      gap: 1.4em;
    }
    .pin-label {
      font-size: 0.9em;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .pin-dots {
      display: flex;
      gap: 0.8em;
    }
    .pin-dot {
      width: 1.4em;
      height: 1.8em;
      border: 1px solid var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px, 2vw, 22px);
      opacity: 0.45;
      position: relative;
    }
    .pin-dot.filled {
      opacity: 1;
      background: rgba(0, 255, 0, 0.08);
    }
    .pin-dot.filled::after {
      content: "•";
      text-shadow: 0 0 4px var(--fg);
    }
    .pin-dot.active {
      opacity: 1;
      border-color: var(--fg);
      box-shadow: 0 0 6px rgba(0, 255, 0, 0.5);
    }
    .pin-dot.active::after {
      content: "";
      width: 0.5em;
      height: 1.1em;
      background: var(--fg);
      box-shadow: 0 0 4px var(--fg);
      animation: pin-caret-blink 1s step-end infinite;
    }
    @keyframes pin-caret-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pin-dots.error .pin-dot {
      border-color: var(--error);
      color: var(--error);
    }
    .pin-dots.error .pin-dot.filled::after {
      color: var(--error);
      text-shadow: 0 0 4px var(--error);
    }
    .pin-dots.shake {
      animation: pin-shake 0.4s ease;
    }
    @keyframes pin-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }
    .pin-message {
      font-size: 0.85em;
      min-height: 1.2em;
      opacity: 0.8;
    }
    .pin-message.error {
      color: var(--error);
      text-shadow: 0 0 4px var(--error);
      opacity: 1;
    }
    .settings-row {
      white-space: pre;
      display: flex;
      justify-content: space-between;
      max-width: 420px;
    }
    .settings-row.selected {
      color: #000000;
      background: var(--fg);
      text-shadow: none;
      box-shadow: 0 0 14px 2px rgba(0, 255, 0, 0.65);
    }
    .settings-val {
      opacity: 0.85;
    }
    .settings-val.dropdown-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dropdown-caret {
      font-size: 0.8em;
      opacity: 0.75;
    }
    .dropdown-panel {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin: 2px 0 8px 1.6em;
    }
    .dropdown-option.current {
      font-weight: bold;
    }

    body.era-modern .crt,
    body.era-2000s .crt,
    body.era-2010s .crt {
      border-radius: 0;
      box-shadow: none;
      animation: none;
    }
    body.era-modern .crt::before,
    body.era-modern .crt::after,
    body.era-2000s .crt::before,
    body.era-2000s .crt::after,
    body.era-2010s .crt::before,
    body.era-2010s .crt::after {
      content: none;
    }
    body.era-modern .crt-vignette, body.era-modern .crt-curve,
    body.era-modern .crt-noise, body.era-modern .crt-roll,
    body.era-2000s .crt-vignette, body.era-2000s .crt-curve,
    body.era-2000s .crt-noise, body.era-2000s .crt-roll,
    body.era-2010s .crt-vignette, body.era-2010s .crt-curve,
    body.era-2010s .crt-noise, body.era-2010s .crt-roll {
      display: none;
    }
    body.era-modern .terminal-wrap,
    body.era-2000s .terminal-wrap,
    body.era-2010s .terminal-wrap {
      animation: none;
    }

    body.era-modern .crt { background: #0b0d10; }
    body.era-modern .lines, body.era-modern .play-screen {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e4e6eb;
      text-shadow: none;
    }
    body.era-modern .menu-row, body.era-modern .game-row, body.era-modern .settings-row {
      border-radius: 6px;
      padding: 4px 8px;
    }
    body.era-modern .menu-row.selected, body.era-modern .game-row.selected, body.era-modern .settings-row.selected {
      background: #6366f1;
      color: #fff;
      text-shadow: none;
      box-shadow: none;
    }
    body.era-modern #game-search { border-bottom-color: #6366f1; color: #e4e6eb; }
    body.era-modern .section-title { opacity: 0.5; }
    body.era-modern .pin-dot { border-color: #6366f1; }
    body.era-modern .pin-dot.filled::after { text-shadow: none; }

    body.era-2000s .crt {
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,0.5) 0, rgba(255,255,255,0.5) 2px, transparent 2px, transparent 42px),
        #ece9d8;
    }
    body.era-2000s .lines, body.era-2000s .play-screen {
      font-family: Verdana, Tahoma, Geneva, sans-serif;
      color: #000;
      text-shadow: none;
      font-size: 13px;
    }

    .xp-titlebar, .xp-toolbar { display: none; }
    body.era-2000s .xp-titlebar, body.era-2000s .xp-toolbar {
      display: flex;
    }
    body.era-2000s .terminal {
      padding-top: calc(4vh + 58px);
    }

    .xp-titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 27px;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      background: linear-gradient(to bottom,
        color-mix(in srgb, var(--fg) 55%, white) 0%,
        var(--fg) 45%,
        color-mix(in srgb, var(--fg) 70%, black) 100%);
      color: #fff;
      font-family: Tahoma, Verdana, sans-serif;
      font-size: 12px;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      z-index: 20;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    .xp-titlebar-left { display: flex; align-items: center; gap: 5px; }
    .xp-titlebar-btns { display: flex; gap: 2px; }
    .xp-btn {
      width: 19px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(to bottom, #fbfbfb, #c6c6c6);
      color: #000;
      border-radius: 2px;
      border: 1px solid #7d7d7d;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
    }
    .xp-btn:hover { filter: brightness(1.08); }
    .xp-btn-close { background: linear-gradient(to bottom, #f68e8e, #d33131); color: #fff; }

    .xp-toolbar {
      position: absolute;
      top: 27px; left: 0; right: 0;
      height: 27px;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      background: linear-gradient(to bottom, #f6f6f2, #dcdcd2);
      border-bottom: 1px solid #9a9a8c;
      font-family: Tahoma, Verdana, sans-serif;
      font-size: 11px;
      color: #333;
      z-index: 20;
    }
    .xp-tool { opacity: 0.85; white-space: nowrap; }
    .xp-tool-back, .xp-tool-home { cursor: pointer; }
    .xp-tool-back:hover, .xp-tool-home:hover { opacity: 1; text-decoration: underline; }
    .xp-addressbar {
      flex: 1;
      background: #fff;
      border: 1px solid #7f9db9;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      font-size: 11px;
      color: #333;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .xp-go {
      background: linear-gradient(to bottom, #fefefe, #ece9d8);
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #919b9c;
      border-bottom: 1px solid #919b9c;
      padding: 1px 10px;
      font-size: 11px;
      font-weight: bold;
      color: color-mix(in srgb, var(--fg) 80%, black);
      cursor: pointer;
    }

    body.era-2000s .section-title {
      background: linear-gradient(to bottom,
        color-mix(in srgb, var(--fg) 60%, white),
        color-mix(in srgb, var(--fg) 75%, black));
      color: #fff;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: bold;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.35);
      border: 1px solid color-mix(in srgb, var(--fg) 65%, black);
      letter-spacing: 0.03em;
      opacity: 1;
      display: flex;
      align-items: center;
    }
    .blink-badge { display: none; }
    body.era-2000s .blink-badge {
      display: inline-block;
      margin-left: 8px;
      color: #ffff33;
      font-weight: bold;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.6);
      animation: blink-badge-flash 1s steps(1) infinite;
    }
    @keyframes blink-badge-flash {
      50% { opacity: 0; }
    }

    body.era-2000s .menu-row, body.era-2000s .game-row, body.era-2000s .settings-row {
      background: linear-gradient(to bottom, #fefefe, #ece9d8);
      border-top: 1px solid #fff;
      border-left: 1px solid #fff;
      border-right: 1px solid #919b9c;
      border-bottom: 1px solid #919b9c;
      padding: 3px 8px;
      margin-bottom: 3px;
    }
    body.era-2000s .menu-row.selected, body.era-2000s .game-row.selected, body.era-2000s .settings-row.selected {
      background: linear-gradient(to bottom,
        color-mix(in srgb, var(--fg) 55%, white),
        color-mix(in srgb, var(--fg) 75%, black));
      color: #fff;
      border: 1px solid color-mix(in srgb, var(--fg) 70%, black);
      text-shadow: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    body.era-2000s #game-search {

      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.25);
      color: #000;
      font-family: Verdana, Tahoma, sans-serif;
      padding: 3px 6px;
    }
    body.era-2000s .pin-dot { border-color: var(--fg); color: #000; background: #fff; }
    body.era-2000s .pin-dot.filled::after { color: #000; text-shadow: none; }

    body.era-2000s #play-screen-content::-webkit-scrollbar { width: 16px; }
    body.era-2000s #play-screen-content::-webkit-scrollbar-track {
      background: #ece9d8;
      border-left: 1px solid #9a9a8c;
    }
    body.era-2000s #play-screen-content::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #fbfbfb, #c6c6c6);
      border: 1px solid #9a9a8c;
    }

    body.era-2010s .crt { background: #eef1f5; }
    body.era-2010s .lines, body.era-2010s .play-screen {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #2c3e50;
      text-shadow: none;
    }
    body.era-2010s .menu-row, body.era-2010s .game-row, body.era-2010s .settings-row {
      background: #fff;
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    body.era-2010s .menu-row.selected, body.era-2010s .game-row.selected, body.era-2010s .settings-row.selected {
      background: #2980b9;
      color: #fff;
      text-shadow: none;
      box-shadow: 0 2px 6px rgba(41, 128, 185, 0.4);
    }
    body.era-2010s #game-search { border-bottom-color: #2980b9; color: #2c3e50; }
    body.era-2010s .section-title { color: #7f8c8d; opacity: 1; }
    body.era-2010s .pin-dot { border-color: #2980b9; color: #2980b9; }
    body.era-2010s .pin-dot.filled::after { color: #2980b9; text-shadow: none; }

    body.mouse-nav .menu-row,
    body.mouse-nav .game-row,
    body.mouse-nav .settings-row {
      cursor: pointer;
    }
    body.era-modern.mouse-nav .menu-row:hover:not(.selected),
    body.era-modern.mouse-nav .game-row:hover:not(.selected),
    body.era-modern.mouse-nav .settings-row:hover:not(.selected) {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 6px;
    }
    body.era-2000s.mouse-nav .menu-row:hover:not(.selected),
    body.era-2000s.mouse-nav .game-row:hover:not(.selected),
    body.era-2000s.mouse-nav .settings-row:hover:not(.selected) {
      background: linear-gradient(to bottom,
        color-mix(in srgb, var(--fg) 12%, white),
        color-mix(in srgb, var(--fg) 25%, white));
      border-color: color-mix(in srgb, var(--fg) 55%, #7f9db9);
    }
    body.era-2010s.mouse-nav .menu-row:hover:not(.selected),
    body.era-2010s.mouse-nav .game-row:hover:not(.selected),
    body.era-2010s.mouse-nav .settings-row:hover:not(.selected) {
      background: #f0f4f8;
    }
  </style>
  </head>
  <body>
  <div class="crt">
    <div class="xp-titlebar" id="xp-titlebar">
      <span class="xp-titlebar-left">
        <span class="xp-titlebar-icon">🗂</span>
        <span class="xp-titlebar-text">The ArchIve Portal - Microsoft Internet Explorer</span>
      </span>
      <span class="xp-titlebar-btns">
        <span class="xp-btn xp-btn-min">_</span>
        <span class="xp-btn xp-btn-max">▢</span>
        <span class="xp-btn xp-btn-close">✕</span>
      </span>
    </div>
    <div class="xp-toolbar" id="xp-toolbar">
      <span class="xp-tool xp-tool-back">◀ Back</span>
      <span class="xp-tool">Forward ▶</span>

    function renderDropdownOptions(container, type) {
      const options = type === 'theme' ? themes : eras;
      const currentIdx = type === 'theme' ? currentThemeIndex : currentEraIndex;

      const panel = document.createElement('div');
      panel.className = 'dropdown-panel';

      options.forEach((opt, i) => {
        const optRow = document.createElement('div');
        const isHighlighted = i === dropdownHighlightIndex;
        const isCurrent = i === currentIdx;
        optRow.className = 'settings-row dropdown-option' + (isHighlighted ? ' selected' : '') + (isCurrent ? ' current' : '');
        optRow.textContent = (isCurrent ? '\u2713 ' : '\u00a0\u00a0') + opt.name;

        optRow.addEventListener('mouseenter', () => {
          if (!isMouseEra()) return;
          if (dropdownHighlightIndex === i) return;
          dropdownHighlightIndex = i;
          renderSettingsList();
        });
        optRow.addEventListener('click', (e) => {
          if (!isMouseEra()) return;
          e.stopPropagation();
          if (type === 'theme') {
            applyTheme(i);
          } else {
            applyEra(i);
          }
          openDropdownType = null;
          renderSettingsList();
        });

        panel.appendChild(optRow);
      });

      container.appendChild(panel);
    }

    function renderSettingsList() {
      const effectsEl = document.getElementById('settings-list-effects');
      const themeEl = document.getElementById('settings-list-theme');
      const eraEl = document.getElementById('settings-list-era');
      if (!effectsEl || !themeEl || !eraEl) return;
      effectsEl.innerHTML = '';
      themeEl.innerHTML = '';
      eraEl.innerHTML = '';

      settingsItems.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'settings-row' + (idx === settingsSelectedIndex ? ' selected' : '');
        const prefix = idx === settingsSelectedIndex ? '  > ' : '    ';

        row.addEventListener('mouseenter', () => {
          if (!isMouseEra()) return;
          const dropdownWouldClose = openDropdownType && openDropdownType !== item.type;
          if (settingsSelectedIndex === idx && !dropdownWouldClose) return;
          settingsSelectedIndex = idx;
          if (dropdownWouldClose) {
            openDropdownType = null;
          }
          renderSettingsList();
        });

        if (item.type === 'toggle') {
          const val = settings[item.key] ? 'ON' : 'OFF';
          row.innerHTML = `<span>${prefix}${item.label}</span><span class="settings-val">[ ${val} ]</span>`;
          row.addEventListener('click', () => {
            if (!isMouseEra()) return;
            settingsSelectedIndex = idx;
            toggleSetting(idx);
          });
          effectsEl.appendChild(row);
        } else if (item.type === 'theme' || item.type === 'era') {
          const currentName = item.type === 'theme' ? themes[currentThemeIndex].name : eras[currentEraIndex].name;
          const isOpen = openDropdownType === item.type;
          row.innerHTML = `<span>${prefix}${item.label}</span><span class="settings-val dropdown-toggle">${currentName} <span class="dropdown-caret">${isOpen ? '\u25b2' : '\u25bc'}</span></span>`;
          row.addEventListener('click', () => {
            if (!isMouseEra()) return;
            settingsSelectedIndex = idx;
            openDropdown(item.type);
          });
          const targetEl = item.type === 'theme' ? themeEl : eraEl;
          targetEl.appendChild(row);
          if (isOpen) {
            renderDropdownOptions(targetEl, item.type);
          }
        }
      });
    }

    function openDropdown(type) {
      if (openDropdownType === type) {
        openDropdownType = null;
      } else {
        openDropdownType = type;
        dropdownHighlightIndex = type === 'theme' ? currentThemeIndex : currentEraIndex;
      }
      renderSettingsList();
    }

    function confirmDropdownSelection() {
      if (!openDropdownType) return;
      if (openDropdownType === 'theme') {
        applyTheme(dropdownHighlightIndex);
      } else {
        applyEra(dropdownHighlightIndex);
      }
      openDropdownType = null;
      renderSettingsList();
    }

    function toggleSetting(idx) {
      const item = settingsItems[idx];
      if (!item || item.type !== 'toggle') return;
      settings[item.key] = !settings[item.key];
      applySettings();
      renderSettingsList();
    }

    function cycleTheme(direction) {
      applyTheme(currentThemeIndex + direction);
      renderSettingsList();
    }

    function cycleEra(direction) {
      applyEra(currentEraIndex + direction);

    function closeSettingsScreen() {
      document.removeEventListener('keydown', onSettingsScreenKeydown);
      openDropdownType = null;

    function onSettingsScreenKeydown(e) {
      if (openDropdownType) {
        const options = openDropdownType === 'theme' ? themes : eras;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          dropdownHighlightIndex = (dropdownHighlightIndex + 1) % options.length;
          renderSettingsList();
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          dropdownHighlightIndex = (dropdownHighlightIndex - 1 + options.length) % options.length;
          renderSettingsList();
          return;
        }
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmDropdownSelection();
          return;
        }
        if (e.key === 'Escape' || e.key === 'Backspace') {
          e.preventDefault();
          openDropdownType = null;
          renderSettingsList();
          return;
        }
        return;
      }

      if (e.key === 'Escape' || e.key === 'Backspace') {
        e.preventDefault();
        closeSettingsScreen();
        return;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        settingsSelectedIndex = (settingsSelectedIndex + 1) % settingsItems.length;
        renderSettingsList();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        settingsSelectedIndex = (settingsSelectedIndex - 1 + settingsItems.length) % settingsItems.length;
        renderSettingsList();
        return;
      }

      const currentItem = settingsItems[settingsSelectedIndex];

      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentItem.type === 'toggle') {
          toggleSetting(settingsSelectedIndex);
        } else if (currentItem.type === 'theme' || currentItem.type === 'era') {
          openDropdown(currentItem.type);
        }
        return;
      }

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        if (currentItem.type === 'theme') {
          cycleTheme(-1);
        } else if (currentItem.type === 'era') {
          cycleEra(-1);
        } else if (currentItem.type === 'toggle') {
          toggleSetting(settingsSelectedIndex);
        }
        return;
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        if (currentItem.type === 'theme') {
          cycleTheme(1);
        } else if (currentItem.type === 'era') {
          cycleEra(1);
        } else if (currentItem.type === 'toggle') {
          toggleSetting(settingsSelectedIndex);
        }
        return;
      }
    }

      });
    }

    function renderDualList(popular, newItems, indexOnly) {
      const contentEl = document.getElementById('play-screen-content');
      const headerTitle = (currentMode === "games") ? "-- Popular Hits --" : "-- Featured Software --";
      
      contentEl.innerHTML = `
        <div class="section-title">${headerTitle}</div>
        <div class="game-list" id="popular-list"></div>
        <div class="section-title">-- New Releases --<span class="blink-badge">NEW!</span></div>
        <div class="game-list" id="new-list"></div>
        <div class="section-title">-- Index --</div>
        <div class="game-list" id="all-list"></div>
      `;

      const popList = document.getElementById('popular-list');
      const newList = document.getElementById('new-list');
      const allList = document.getElementById('all-list');

      let totalIdx = 0;
      
      popular.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'game-row' + (totalIdx === itemSelectedIndex ? ' selected' : '');
        row.textContent = (totalIdx === itemSelectedIndex ? '  > ' : '    ') + item.name;
        bindItemRow(row, totalIdx, item);
        popList.appendChild(row);
        totalIdx++;
      });

      newItems.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'game-row' + (totalIdx === itemSelectedIndex ? ' selected' : '');
        row.textContent = (totalIdx === itemSelectedIndex ? '  > ' : '    ') + item.name;
        bindItemRow(row, totalIdx, item);
        newList.appendChild(row);
        totalIdx++;
      });

      indexOnly.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'game-row' + (totalIdx === itemSelectedIndex ? ' selected' : '');
        row.textContent = (totalIdx === itemSelectedIndex ? '  > ' : '    ') + item.name;
        bindItemRow(row, totalIdx, item);
        allList.appendChild(row);
        totalIdx++;
      });
    }

    function renderSingleList(list) {
      const contentEl = document.getElementById('play-screen-content');
      contentEl.innerHTML = `
        <div class="section-title">-- Search Results --</div>
        <div class="game-list" id="search-list"></div>
      `;
      const searchList = document.getElementById('search-list');

      if (list.length === 0) {
        searchList.innerHTML = `<div class="no-results">no items found</div>`;
        return;
      }

      list.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'game-row' + (idx === itemSelectedIndex ? ' selected' : '');
        row.textContent = (idx === itemSelectedIndex ? '  > ' : '    ') + item.name;
        bindItemRow(row, idx, item);
        searchList.appendChild(row);
      });
    }

    function onItemSearchInput(e) {
      const query = e.target.value.trim().toLowerCase();
      itemSelectedIndex = 0;
      updateItemFilter(query);
    }

    function downloadFile(filename, filepath) {
      fetch(filepath)
        .then(res => res.blob())
        .then(blob => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        })
        .catch(err => {
          console.error('Download failed:', err);
        });
    }

    function launchAsset(item) {
      if (!item || !item.url) return;

      const popup = window.open('', '_blank', 'width=' + screen.width + ',height=' + screen.height);

      if (!popup) {
        window.open(item.url, '_blank');
        return;
      }

      fetch(item.url)
        .then(res => {
          if (!res.ok) throw new Error('fetch failed');
          return res.text();
        })
        .then(html => {
          popup.document.open();
          popup.document.write(html);
          popup.document.close();
        })
        .catch(() => {
          popup.location.href = item.url;
        });
    }

    function onBrowseScreenKeydown(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        closeBrowseScreen();
        return;
      }

      if (e.key === 'Backspace') {
        const searchInput = document.getElementById('game-search');
        if (!searchInput || searchInput.value === '') {
          e.preventDefault();
          closeBrowseScreen();
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (filteredItems.length === 0) return;
        itemSelectedIndex = (itemSelectedIndex + 1) % filteredItems.length;
        updateItemFilter(document.getElementById('game-search').value.trim().toLowerCase());
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        itemSelectedIndex = (itemSelectedIndex - 1 + filteredItems.length) % filteredItems.length;
        updateItemFilter(document.getElementById('game-search').value.trim().toLowerCase());
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const item = filteredItems[itemSelectedIndex];
        if (item) {
          if (item.special === 'antihd') {
            document.removeEventListener('keydown', onBrowseScreenKeydown);
            openPinScreen();
          } else {
            launchAsset(item);
          }
        }
      }
    }

    let pinBuffer = '';

    function openPinScreen() {
      pinBuffer = '';
      const playScreen = document.getElementById('play-screen');
      playScreen.innerHTML = `
        <div class="pin-screen">
          <div class="pin-label">antiHD // enter access pin</div>
          <div class="pin-dots" id="pin-dots"></div>
          <div id="pin-message" class="pin-message">&nbsp;</div>
        </div>
        <div style="font-size: 11px; opacity: 0.5; margin-top: 1em;">[ BACKSPACE (empty): back | ESC: back (exits fullscreen) | ENTER: submit ]</div>
      `;
      renderPinDots();
      document.addEventListener('keydown', onPinScreenKeydown);
    }

    function renderPinDots() {
      const dotsEl = document.getElementById('pin-dots');
      if (!dotsEl) return;
      dotsEl.innerHTML = '';
      for (let pos = 0; pos < ANTIHD_PIN.length; pos++) {
        const dot = document.createElement('div');
        dot.className = 'pin-dot';
        if (pos < pinBuffer.length) {
          dot.classList.add('filled');
        } else if (pos === pinBuffer.length) {
          dot.classList.add('active');
        }
        dotsEl.appendChild(dot);
      }
    }

    function showPinError() {
      const dotsEl = document.getElementById('pin-dots');
      const msg = document.getElementById('pin-message');
      if (msg) {
        msg.textContent = '> access denied.';
        msg.classList.add('error');
      }
      if (dotsEl) {
        dotsEl.classList.add('error', 'shake');
        setTimeout(() => {
          dotsEl.classList.remove('shake');
        }, 400);
      }
    }

    function clearPinError() {
      const dotsEl = document.getElementById('pin-dots');
      const msg = document.getElementById('pin-message');
      if (msg) {
        msg.textContent = '\u00a0';
        msg.classList.remove('error');
      }
      if (dotsEl) dotsEl.classList.remove('error');
    }

    function onPinScreenKeydown(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        document.removeEventListener('keydown', onPinScreenKeydown);
        closeBrowseScreen();
        return;
      }
      if (e.key === 'Backspace') {
        e.preventDefault();
        if (pinBuffer.length > 0) {
          pinBuffer = pinBuffer.slice(0, -1);
          clearPinError();
          renderPinDots();
        } else {

          document.removeEventListener('keydown', onPinScreenKeydown);
          closeBrowseScreen();
        }
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (pinBuffer.length === 0) return;
        if (pinBuffer === ANTIHD_PIN) {
          document.removeEventListener('keydown', onPinScreenKeydown);
          openBrowseScreen('games', true);
        } else {
          showPinError();
          pinBuffer = '';
          renderPinDots();
        }
        return;
      }
      if (/^[0-9]$/.test(e.key) && pinBuffer.length < ANTIHD_PIN.length) {
        e.preventDefault();
        clearPinError();
        pinBuffer += e.key;
        renderPinDots();
      }
    }



    function renderMenu(container) {
      container.innerHTML = '';
      getMenuOptions().forEach((opt, idx) => {
        const row = document.createElement('div');
        row.className = 'menu-row' + (idx === selectedIndex ? ' selected' : '');
        row.textContent = (idx === selectedIndex ? '  > ' : '    ') + opt.label;
        row.addEventListener('mouseenter', () => {
          if (!isMouseEra() || !menuActive) return;
          if (selectedIndex === idx) return;
          selectedIndex = idx;
          renderMenu(container);
        });
        row.addEventListener('click', () => {
          if (!isMouseEra() || !menuActive) return;
          selectedIndex = idx;
          handleSelection(opt.action);
        });
        container.appendChild(row);
      });
    }

    function onMenuKeydown(e) {
      if (!menuActive) return;
      const menuEl = document.getElementById('menu-list');
      const visibleOptions = getMenuOptions();
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % visibleOptions.length;
        renderMenu(menuEl);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + visibleOptions.length) % visibleOptions.length;
        renderMenu(menuEl);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        handleSelection(visibleOptions[selectedIndex].action);
      }
    }

    function typeLine(entry, onDone) {
      if (entry.type === "menu") {
        const wrap = document.createElement('div');
        wrap.className = 'line shown';
        wrap.id = 'menu-list';
        linesEl.appendChild(wrap);
        selectedIndex = 0;
        renderMenu(wrap);
        menuActive = true;
        document.addEventListener('keydown', onMenuKeydown);
        onDone();
        return;
      }

      const div = document.createElement('div');
      div.className = 'line';
      linesEl.appendChild(div);
      requestAnimationFrame(() => div.classList.add('shown'));

      if (!entry.text) {
        div.innerHTML = '&nbsp;';
        setTimeout(onDone, 80);
        return;
      }

      let charIndex = 0;
      const speed = 25;
      function typeChar() {
        if (charIndex <= entry.text.length) {
          div.textContent = entry.text.slice(0, charIndex);
          charIndex++;
          setTimeout(typeChar, speed);
        } else {
          onDone();
        }
      }
      typeChar();
    }

    function runScript() {
      if (i >= script.length) return;
      const entry = script[i];
      i++;
      const delay = entry.text === "" ? 60 : 0;
      setTimeout(() => typeLine(entry, runScript), delay);
    }

    setTimeout(runScript, 350);
    setTimeout(() => hintEl.classList.add('shown'), 600);

    const xpBackBtn = document.querySelector('.xp-tool-back');
    if (xpBackBtn) {
      xpBackBtn.addEventListener('click', () => simulateKey('Backspace'));
    }

    const xpHomeBtn = document.querySelector('.xp-tool-home');
    if (xpHomeBtn) {
      xpHomeBtn.addEventListener('click', () => goHome());
    }

    const xpMinBtn = document.querySelector('.xp-btn-min');
    if (xpMinBtn) {
      xpMinBtn.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      });
    }

    const xpMaxBtn = document.querySelector('.xp-btn-max');
    if (xpMaxBtn) {
      xpMaxBtn.addEventListener('click', () => {
        fullscreenRequested = true;
        hintEl.classList.remove('shown');
        doRequestFullscreen();
      });
    }

    const xpCloseBtn = document.querySelector('.xp-btn-close');
    if (xpCloseBtn) {
      xpCloseBtn.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        try { window.close(); } catch (err) {}
      });
    }
  </script>
